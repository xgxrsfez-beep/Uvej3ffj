<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>د. درايفينغ أونلاين</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="joinScreen">
    <div class="join-box">
      <h1>🚗 د. درايفينغ أونلاين</h1>
      <p class="subtitle">اختر اسمك ولون سيارتك وانطلق</p>
      <input id="nameInput" type="text" maxlength="20" placeholder="اسمك داخل اللعبة">
      <div class="colors">
        <label>لون سيارتك:</label>
        <div id="colorPicker"></div>
      </div>
      <button id="joinBtn">🚦 دخول الخريطة</button>
      <p id="status" class="status"></p>
    </div>
  </div>

  <div id="map"></div>

  <div id="topBar">
    <span id="countBadge">👥 0</span>
    <div class="spacer"></div>
    <button id="playersBtn" title="قائمة اللاعبين">👥</button>
    <button id="chatBtn" title="الدردشة">💬</button>
    <button id="shareBtn" title="دعوة أصدقائك">🔗</button>
    <button id="leaveBtn" title="خروج">🚪</button>
  </div>

  <div id="playersPanel" class="panel hidden">
    <h3>👥 اللاعبون المتصلون</h3>
    <ul id="playersList"></ul>
  </div>

  <div id="chatPanel" class="panel hidden">
    <h3>💬 الدردشة العامة</h3>
    <div id="chatMessages"></div>
    <div id="chatInputRow">
      <input id="chatInput" type="text" maxlength="120" placeholder="اكتب رسالة...">
      <button id="chatSend">إرسال</button>
    </div>
  </div>

  <div id="help">🖱️ انقر على الخريطة للتحرك · ⌨️ WASD أو الأسهم</div>
  <div id="toast" class="hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
